# Local Development Docker Compose
# - Runs on developer's machine
# - Uses local bind mounts for hot reloading
# - Exposes ports for local debugging
# - NODE_ENV=local
#
# Usage: docker compose up

x-app-base: &app-base
  image: node:22-alpine
  working_dir: /app
  environment:
    PORT: ${PORT:-3010}
    DATABASE_URL: postgresql://invoice:invoice@postgres:5432/invoice
    AUTH_SECRET: ${AUTH_SECRET}
    AUTH_URL: ${AUTH_URL:-http://localhost:3010}
    AUTH_TRUST_HOST: "true"
    ADMIN_USER: ${ADMIN_USER}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    LLM_BASE_URL: ${LLM_BASE_URL}
    LLM_API_KEY: ${LLM_API_KEY}
    LLM_MODEL: ${LLM_MODEL}
    DATA_DIR: /data
    NODE_ENV: local
  depends_on:
    db:
      condition: service_healthy

services:

  app:
    <<: *app-base
    build:
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run app:dev"
    ports:
      - "3010:3010"
    volumes:
      - .:/app
      - ./docker/app-files/data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

  worker:
    <<: *app-base
    build:
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run worker:debug"
    volumes:
      - .:/app
      - ./docker/app-files/data:/data
    ports:
      - "9229:9229"
    extra_hosts:
      - host.docker.internal:host-gateway

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
      POSTGRES_DB: invoice
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  invoice_node_modules: