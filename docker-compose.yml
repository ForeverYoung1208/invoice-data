x-app-base: &app-base
  image: node:22-alpine
  working_dir: /app
  environment:
    DATABASE_URL: postgresql://invoice:invoice@postgres:5432/invoice
    AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
    ADMIN_USER: ${ADMIN_USER:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:4000/v1}
    LLM_API_KEY: ${LLM_API_KEY:-dev-key}
    LLM_MODEL: ${LLM_MODEL:-amazon.nova-lite-2-v1:0}
    DATA_DIR: /data
    NODE_ENV: development
  volumes:
    - .:/app
    - invoice_node_modules:/app/node_modules
    - ./docker/app-files/data:/data
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:

  app:
    <<: *app-base
    command: sh -c "npm install && npm run app:dev"
    ports:
      - "3000:3000"
  
  worker:
    <<: *app-base
    command: sh -c "npm install && npm run worker:dev"

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
      POSTGRES_DB: ${TYPEORM_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TYPEORM_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    environment:
      - AWS_REGION=eu-central-1
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
    ports:
      - "3000:3000"

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.ssh:/tmp/.ssh:ro
      - ~/.pi:/tmp/.pi:ro
      - dev_home:/root
      - npm_global_modules:/usr/local/lib/node_modules
      - npm_global_bin:/usr/local/bin
    restart: unless-stopped

volumes:
  npm_global_modules:
  npm_global_bin:
  dev_home:
  invoice_node_modules: