# Development (Remote) Docker Compose
# - Runs on remote EC2 instance
# - Uses EBS bind mounts at './docker/app-files/data' for persistence
# - NODE_ENV=development
#
# Usage: docker compose -f docker-compose.dev.yml up -d

x-app-base: &app-base
  image: node:24-alpine
  working_dir: /app
  env_file:
    - .env
  environment:
    PORT: ${PORT}
    AUTH_SECRET: ${AUTH_SECRET}
    AUTH_URL: ${AUTH_URL}
    AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
    ADMIN_USER: ${ADMIN_USER}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    LLM_BASE_URL: ${LLM_BASE_URL}
    LLM_API_KEY: ${LLM_API_KEY}
    LLM_MODEL: ${LLM_MODEL}
    NODE_ENV: development
    NEXT_ALLOWED_DEV_ORIGINS: ${NEXT_ALLOWED_DEV_ORIGINS}
  depends_on:
    db:
      condition: service_healthy

services:

  app:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run app:dev
    ports:
      - ${PORT}:${PORT}
    volumes:
      - .:/app
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway    

  worker:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker:dev
    volumes:
      - .:/app
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway    

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
      POSTGRES_DB: ${TYPEORM_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TYPEORM_USERNAME} -d ${TYPEORM_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
