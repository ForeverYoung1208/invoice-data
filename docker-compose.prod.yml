# Production Docker Compose
# - Runs on EC2 with CloudFront in front
# - Uses EBS bind mounts at './docker/app-files/data' for persistence
# - NODE_ENV=production
#
# Usage: docker compose -f docker-compose.prod.yml up -d

x-app-base: &app-base
  working_dir: /app
  environment:
    PORT: 3010
    DATABASE_URL: ${DATABASE_URL}
    AUTH_SECRET: ${AUTH_SECRET}
    AUTH_URL: ${AUTH_URL}
    AUTH_TRUST_HOST: ${AUTH_TRUST_HOST}
    ADMIN_USER: ${ADMIN_USER}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    LLM_BASE_URL: ${LLM_BASE_URL}
    LLM_API_KEY: ${LLM_API_KEY}
    LLM_MODEL: ${LLM_MODEL}
    NODE_ENV: production
  depends_on:
    db:
      condition: service_healthy

services:

  app:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run start
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - .:/app
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
  worker:
    <<: *app-base
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run worker:start
    volumes:
      - /docker/app-files/data:/data
    restart: always
    extra_hosts:
      - host.docker.internal:host-gateway
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${TYPEORM_USERNAME}
      POSTGRES_PASSWORD: ${TYPEORM_PASSWORD}
      POSTGRES_DB: ${TYPEORM_DATABASE}
    volumes:
      - /docker/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TYPEORM_USERNAME} -d ${TYPEORM_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always